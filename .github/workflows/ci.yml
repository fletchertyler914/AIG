name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: '1'
  HUSKY: '0'
  CI: 'true'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Biome
        run: pnpm check:ci

      - name: Module boundaries
        run: pnpm check:boundaries

      - name: Unit tests
        run: pnpm test:unit

      - name: Eval (mock mode)
        env:
          EVAL_MODE: mock
        run: pnpm test:eval

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
          ANTHROPIC_API_KEY: placeholder
          ARCADE_API_KEY: placeholder
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aig_test
          ANTHROPIC_API_KEY: placeholder
          ARCADE_API_KEY: placeholder
          E2E_MOCK_ARCADE: '1'
        run: pnpm test:e2e

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
